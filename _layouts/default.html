<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site">
      <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <p class="site-description">{{ site.description | escape }}</p>
      </header>
      <main id="main" tabindex="-1">
        {{ content }}
      </main>
      <footer class="site-footer">
        <a href="https://github.com/zjutoe">GitHub</a>
      </footer>
    </div>
  </body>
</html>
