<section class="post-comments" aria-labelledby="comments-title">
  <h2 id="comments-title">{{ site.data.languages[page.lang].comments }}</h2>
  <p class="comments-hint">{{ site.data.languages[page.lang].comments_hint }}</p>
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repo | escape }}"
          data-repo-id="{{ site.giscus.repo_id | escape }}"
          data-category="{{ site.giscus.category | escape }}"
          data-category-id="{{ site.giscus.category_id | escape }}"
          data-mapping="specific"
          data-term="{{ page.translation_key | escape }}"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="light"
          data-lang="{{ page.lang | escape }}"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</section>
